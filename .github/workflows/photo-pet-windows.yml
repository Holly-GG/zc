name: Build Niangao Photo Pet
on:
  push:
    branches: [main]
    paths:
      - 'photo_pet/**'
      - '.github/workflows/photo-pet-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: niangao-photo-pet
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: photo_pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: photo_pet/requirements-build.txt
      - name: Install pinned tools
        run: python -m pip install -r requirements-build.txt
      - name: Unit and Qt interface tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pytest -q 2>&1 | Tee-Object test-results/unit.log
          if ($LASTEXITCODE -ne 0) { throw 'Unit/Qt tests failed' }
      - name: Build standalone exe
        run: python tools/build.py
      - name: Packaged exe smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath ./dist/Niangao-PhotoPet.exe -ArgumentList '--smoke','--settings',"$env:RUNNER_TEMP/photo-smoke-settings.json",'--probe',"$env:RUNNER_TEMP/photo-smoke-probe.json" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged smoke failed: $($process.ExitCode)" }
          'Packaged exe smoke PASS' | Set-Content test-results/exe-smoke.log
      - name: Packaged life dashboard smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath ./dist/Niangao-PhotoPet.exe -ArgumentList '--suite-smoke','--settings',"$env:RUNNER_TEMP/life-smoke/settings.json",'--probe',"$env:RUNNER_TEMP/life-smoke-probe.json" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Life smoke timeout' }
          if ($process.ExitCode -ne 0) { throw "Life smoke failed: $($process.ExitCode)" }
          'Packaged life dashboard smoke PASS' | Set-Content test-results/life-smoke.log
      - name: Packaged motion and sound resource smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath ./dist/Niangao-PhotoPet.exe -ArgumentList '--motion-smoke','--settings',"$env:RUNNER_TEMP/motion-smoke/settings.json",'--probe',"$env:RUNNER_TEMP/motion-smoke/probe.json" -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Motion smoke timeout' }
          if ($process.ExitCode -ne 0) { throw "Motion smoke failed: $($process.ExitCode)" }
          'Packaged 47 actions, 32 new pose resources and 9 sound families PASS' | Set-Content test-results/motion-smoke.log
      - name: Packaged stationery desktop smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath ./dist/Niangao-PhotoPet.exe -ArgumentList '--desktop-smoke','--settings',"$env:RUNNER_TEMP/stationery-smoke/settings.json",'--probe',"$env:RUNNER_TEMP/stationery-smoke/probe.json" -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Desktop smoke timeout' }
          if ($process.ExitCode -ne 0) { throw "Desktop smoke failed: $($process.ExitCode)" }
          'Packaged 44 images, no 3D space, mandatory profile, fountain and cleanup PASS' | Set-Content test-results/stationery-smoke.log
      - name: Native Windows desktop acceptance
        run: |
          python tools/test_windows_desktop.py --exe dist/Niangao-PhotoPet.exe --output test-results/native 2>&1 | Tee-Object test-results/windows-desktop.log
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop acceptance failed; inspect annotation and logs' }
      - name: Package validated Windows zip
        run: python tools/package.py
      - name: Upload build and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Niangao-PhotoPet-Windows
          path: |
            photo_pet/dist/Niangao-PhotoPet-windows.zip
            photo_pet/dist/Niangao-PhotoPet-SHA256SUMS.txt
            photo_pet/test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish direct download
        if: github.ref == 'refs/heads/main'
        run: python tools/publish.py
      - name: Download summary
        run: |
          @'
          ## 年糕照片桌宠
          [直接下载 Windows ZIP](https://github.com/Holly-GG/zc/raw/refs/heads/windows-download/Niangao-PhotoPet-windows.zip)
          解压后双击 Niangao-PhotoPet.exe。无需安装 Python、Godot 或 Blender。
          本次运行包含基础测试、打包 exe 启动检查及真实 Win32 鼠标输入验收。
          混合 DPI、显示器热拔、各种第三方应用仍需用户桌面回归。
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
