name: Build downloadable layered UI EXE
on:
  push:
    branches: [codex/ui-exe-20261030]
    paths:
      - 'photo_pet/**'
      - 'fonts/**'
      - 'Niangao-Fonts.zip'
      - '.github/workflows/ui-exe-download.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: photo_pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: photo_pet/requirements-build.txt
      - name: Install pinned Windows dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify components and window controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pytest -q tests/test_component_assets.py tests/test_window_entries.py tests/test_layered_ui.py --tb=short 2>&1 | Tee-Object test-results/download-ui-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            python -c "from pathlib import Path; s=Path('test-results/download-ui-tests.log').read_text(encoding='utf-8-sig',errors='replace')[-14000:]; print('::error title=UI test detail::'+s.replace('%%','%%25').replace(chr(13),'%%0D').replace(chr(10),'%%0A'))"
            exit $testExit
          }
      - name: Build Windows x64 GUI executable
        run: python tools/build.py
      - name: Run packaged UI and functional checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($mode in @('smoke','suite-smoke','desktop-smoke','expanded-smoke','motion-smoke','album-smoke')) {
            $state = Join-Path $env:RUNNER_TEMP "niangao-ui-$mode"
            New-Item -ItemType Directory -Force $state | Out-Null
            $process = Start-Process -FilePath ./dist/Niangao-PhotoPet.exe -ArgumentList "--$mode",'--settings',"$state/settings.json",'--probe',"$state/probe.json" -PassThru
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "$mode timed out" }
            if ($process.ExitCode -ne 0) { throw "$mode failed: $($process.ExitCode)" }
          }
      - name: Prepare download files
        run: |
          python tools/package.py --allow-large
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          Copy-Item dist/Niangao-PhotoPet.exe dist/Niangao-PhotoPet-UI-20261030.exe
          Copy-Item dist/Niangao-PhotoPet-windows.zip dist/Niangao-PhotoPet-UI-20261030-windows.zip
          $files = @('Niangao-PhotoPet-UI-20261030.exe','Niangao-PhotoPet-UI-20261030-windows.zip')
          $lines = foreach ($file in $files) { $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLower(); "$hash  $file" }
          $lines | Set-Content dist/Niangao-PhotoPet-UI-20261030-SHA256.txt
          @'
          Windows x64 layered UI build 2026.10.30.1. Includes 96 independent page component PNGs, 51 item PNGs, bundled fonts and window layout fixes.
          Built on Windows after UI tests and six packaged smoke checks. Mixed-DPI and physical desktop acceptance remain separate.
          '@ | Set-Content release-notes.md
      - name: Publish EXE download attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ui-20261030.1 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title 'Niangao layered UI 2026.10.30.1' --notes-file release-notes.md dist/Niangao-PhotoPet-UI-20261030.exe dist/Niangao-PhotoPet-UI-20261030-windows.zip dist/Niangao-PhotoPet-UI-20261030-SHA256.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Niangao-layered-UI-Windows
          path: |
            photo_pet/dist/*.exe
            photo_pet/dist/*.zip
            photo_pet/dist/*SHA256*.txt
            photo_pet/test-results/*.log
          if-no-files-found: warn
